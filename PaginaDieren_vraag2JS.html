        <div style="text-align: center">

        <script>
            let input = document.querySelector('input[name="voornaam"]');
            input.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') { 
                    if (input.value.trim().toLowerCase() === "lam" || input.value.trim().toLowerCase() === "lammetje") {
                        alert("Goed gedaan! Je gaat door naar de volgende vraag.");
                    } else {
                        alert("Helaas, dat is niet correct. Probeer het nog eens!");

                Verder_Knop.onclick = function () {
